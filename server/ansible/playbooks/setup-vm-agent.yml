---
# Setup the druploy-agent on a VM (or snapshot base).
# Usage: ansible-playbook -i "VM_IP," playbooks/setup-vm-agent.yml -e "preview_server_url=https://api.druploy.dev"
#
# This installs:
# - druploy-agent-update script (downloads agent binary from server)
# - druploy-agent.service (systemd, starts agent on boot)
# - /etc/druploy-agent.env (server URL config)

- name: Setup Druploy Agent on VM
  hosts: all
  become: yes
  vars:
    preview_server_url: "https://api.druploy.dev"

  tasks:
    - name: Copy druploy-agent-update script
      copy:
        src: "{{ playbook_dir }}/../../../vm-agent/systemd/druploy-agent-update"
        dest: /usr/local/bin/druploy-agent-update
        mode: "0755"

    - name: Copy druploy-agent systemd service
      copy:
        src: "{{ playbook_dir }}/../../../vm-agent/systemd/druploy-agent.service"
        dest: /etc/systemd/system/druploy-agent.service
        mode: "0644"
      notify: Reload systemd

    - name: Write druploy-agent environment config
      copy:
        content: "PREVIEW_SERVER_URL={{ preview_server_url }}\n"
        dest: /etc/druploy-agent.env
        mode: "0644"

    - name: Enable druploy-agent service
      systemd:
        name: druploy-agent
        enabled: yes
        daemon_reload: yes

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes
