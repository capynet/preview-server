---
# Deploy landing page files to the server
# Usage: ansible-playbook -i inventory/hosts.yml playbooks/deploy-landing.yml

- name: Deploy Landing Page
  hosts: all
  become: true
  tasks:
    - name: Create landing page directory
      file:
        path: /opt/preview-landing
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy landing page files
      copy:
        src: "{{ playbook_dir }}/../../preview-manager/landing/"
        dest: /opt/preview-landing/
        owner: root
        group: root
        mode: '0644'
