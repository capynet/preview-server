---
- name: Install mkcert for druploy-user
  hosts: druploy-server
  become: yes

  tasks:
    - name: Install mkcert
      apt:
        name: mkcert
        state: present
        update_cache: yes

    - name: Install mkcert for druploy-user user
      become_user: druploy-user
      shell: |
        mkcert -install
      args:
        creates: /home/druploy-user/.local/share/mkcert

    - name: Verify mkcert installation
      become_user: druploy-user
      command: mkcert -CAROOT
      register: mkcert_root
      changed_when: false

    - name: Show mkcert CA root
      debug:
        msg: "mkcert CA root: {{ mkcert_root.stdout }}"
