---
# Deploy Druploy
#
# Usage:
#   ansible-playbook playbooks/deploy-preview-manager.yml

- name: Deploy Druploy
  hosts: druploy-server
  become: yes

  pre_tasks:
    # Put the control-plane into maintenance and wait for in-flight preview
    # deploys to finish BEFORE the role restarts the worker. Skipped (no-op)
    # until admin_api_token is set in the vault, so existing deploys are
    # unaffected. Disable explicitly with -e drain=false.
    - name: Drain deploys before restart (maintenance mode)
      import_tasks: tasks/maintenance_enable.yml
      when:
        - (drain | default(true)) | bool
        - (admin_api_token | default('')) | length > 0
      tags: [code, worker]

  roles:
    - preview-manager

  post_tasks:
    - name: Verify service is running
      systemd:
        name: druploy
        state: started
      register: service_state
      tags: [code]

    - name: Display service status
      debug:
        msg: "Druploy service is {{ service_state.status.ActiveState }}"
      tags: [code]

    - name: Show API endpoints
      debug:
        msg: |
          ================================================
          DRUPLOY DEPLOYED SUCCESSFULLY
          ================================================

          API Endpoints:
            - Health:       http://localhost:8000/api/health
            - Deploy:       POST http://localhost:8000/api/deploy
            - List:         GET http://localhost:8000/api/previews
            - Get Preview:  GET http://localhost:8000/api/previews/{project}/mr-{id}
            - Delete:       DELETE http://localhost:8000/api/previews/{project}/mr-{id}
            - Docs:         http://localhost:8000/docs

          Logs:
            - View logs:    sudo journalctl -u druploy -f
            - Service:      sudo systemctl status druploy

          ================================================

    # Lift maintenance last, after the service is verified healthy. Parked
    # deploys/deletes resume automatically. Mirrors the pre_tasks guard.
    - name: Clear maintenance mode
      import_tasks: tasks/maintenance_clear.yml
      when:
        - (drain | default(true)) | bool
        - (admin_api_token | default('')) | length > 0
      tags: [code, worker]
