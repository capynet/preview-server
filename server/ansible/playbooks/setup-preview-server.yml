---
- name: Setup Druploy Server
  hosts: druploy-server
  become: yes

  roles:
    - docker
    - caddy

  post_tasks:
    - name: Crear usuario druploy-user
      user:
        name: druploy-user
        shell: /bin/bash
        create_home: yes
        groups: docker
        append: yes

    - name: Crear directorios de trabajo
      file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
      loop:
        - { path: '/backups', mode: '0777' }

    - name: Set IS_PREVIEW_SERVER environment variable globally
      lineinfile:
        path: /etc/environment
        line: 'IS_PREVIEW_SERVER=true'
        create: yes
        state: present

    - name: Install required packages
      apt:
        name:
          - jq
        state: present
        update_cache: yes

    - name: Install hcloud CLI
      shell: |
        curl -sL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar xz -C /usr/local/bin hcloud
      args:
        creates: /usr/local/bin/hcloud

    - name: Resumen de instalacion
      debug:
        msg: |
          ==========================================
          SERVIDOR CONFIGURADO CORRECTAMENTE
          ==========================================

          Componentes instalados:
            - Docker y Docker Compose
            - Caddy (caddy-docker-proxy + cloudflare DNS)
            - druploy-network (red Docker compartida)
            - jq (JSON parser)

          Druploy API:
            - URL: https://api.druploy.dev
            - Local: http://localhost:8000

          ==========================================
