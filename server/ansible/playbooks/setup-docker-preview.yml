---
# Setup Docker infrastructure for preview environments
#
# Usage:
#   ansible-playbook playbooks/setup-docker-preview.yml

- name: Setup Docker Preview Infrastructure
  hosts: preview-server
  become: yes

  roles:
    - caddy

  tasks:
    - name: Create Dockerfile directory
      file:
        path: /opt/preview-drupal
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy Drupal Dockerfile
      copy:
        src: "{{ playbook_dir }}/../../preview-manager/docker/Dockerfile.drupal"
        dest: /opt/preview-drupal/Dockerfile
        owner: root
        group: root
        mode: '0644'
      register: dockerfile_changed

    - name: Build Drupal base images
      command: "docker build -t preview-drupal:php{{ item }} --build-arg PHP_VERSION={{ item }} /opt/preview-drupal"
      loop:
        - "8.1"
        - "8.2"
        - "8.3"
        - "8.4"
      when: dockerfile_changed.changed

    - name: Pre-pull database and service images
      command: "docker pull {{ item }}"
      loop:
        - "mysql:5.7"
        - "mysql:8.0"
        - "mysql:8.4"
        - "mariadb:10.6"
        - "mariadb:11.4"
        - "percona:8.0"
        - "redis:7"
        - "solr:9"
      register: pull_result
      changed_when: "'Downloaded newer image' in pull_result.stdout or 'Pull complete' in pull_result.stdout"

    - name: Display results
      debug:
        msg: |
          ================================================
          DOCKER PREVIEW INFRASTRUCTURE READY
          ================================================

          Network: preview-network
          Caddy: running as Docker container (preview-caddy)

          PHP images:
            - preview-drupal:php8.1
            - preview-drupal:php8.2
            - preview-drupal:php8.3
            - preview-drupal:php8.4

          Database images:
            - mysql:5.7, mysql:8.0, mysql:8.4
            - mariadb:10.6, mariadb:11.4
            - percona:8.0

          Service images:
            - redis:7, solr:9

          ================================================
