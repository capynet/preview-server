---
# Setup Docker infrastructure for preview environments
#
# Usage:
#   ansible-playbook playbooks/setup-docker-preview.yml

- name: Setup Docker Preview Infrastructure
  hosts: druploy-server
  become: yes

  roles:
    - caddy

  tasks:
    - name: Create Dockerfile directory
      file:
        path: /opt/druploy-drupal
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy Drupal Dockerfile
      copy:
        src: "{{ playbook_dir }}/../../preview-manager/docker/Dockerfile.drupal"
        dest: /opt/druploy-drupal/Dockerfile
        owner: root
        group: root
        mode: '0644'
      register: dockerfile_changed

    - name: Build and push Drupal base images
      shell: |
        docker build -t localhost:5000/druploy-drupal:php{{ item }} --build-arg PHP_VERSION={{ item }} /opt/druploy-drupal
        docker push localhost:5000/druploy-drupal:php{{ item }}
      loop:
        - "8.1"
        - "8.2"
        - "8.3"
        - "8.4"
      when: dockerfile_changed.changed

    - name: Clean up old images and build cache
      shell: docker image prune -af && docker builder prune -af
      when: dockerfile_changed.changed

    - name: Display results
      debug:
        msg: |
          ================================================
          DOCKER PREVIEW INFRASTRUCTURE READY
          ================================================

          Network: druploy-network
          Caddy: running as Docker container (druploy-caddy)

          PHP images (private registry):
            - druploy-drupal:php8.1
            - druploy-drupal:php8.2
            - druploy-drupal:php8.3
            - druploy-drupal:php8.4

          Service images (pulled from Docker Hub by VMs):
            - mysql, mariadb, percona, redis, valkey, solr

          ================================================
