---
# Setup Preview UI infrastructure
#
# This sets up the server for GitHub Actions deployment:
#   - Installs Node.js 22
#   - Configures SSH key for GitHub Actions
#   - Creates directory and systemd service
#
# The actual app deploy happens via GitHub Actions on push to main.
#
# Usage:
#   ansible-playbook playbooks/deploy-preview-ui.yml

- name: Setup Preview UI
  hosts: preview-server
  become: yes

  roles:
    - preview-ui
