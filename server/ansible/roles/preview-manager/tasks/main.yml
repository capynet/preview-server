---
# Preview Manager - Deployment Tasks

- name: Create preview-manager user if not exists
  user:
    name: preview-manager
    shell: /bin/bash
    create_home: yes
    home: /home/preview-manager
    groups: docker
    append: yes
    state: present

- name: Install Python dependencies
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: yes

- name: Ensure preview-user is in preview-manager and docker groups
  user:
    name: preview-user
    groups: preview-manager,docker
    append: yes

- name: Create preview-manager directory structure
  file:
    path: "{{ item }}"
    state: directory
    owner: preview-manager
    group: preview-manager
    mode: '0775'
  loop:
    - /home/preview-manager/www/previews/server/preview-manager
    - /var/www/preview-manager
    - /var/www/preview-manager/db-cache
    - /var/www/preview-manager/infra

# ---- Infrastructure: PostgreSQL + Valkey ----

- name: Deploy infrastructure docker-compose
  template:
    src: infra-docker-compose.yml.j2
    dest: /var/www/preview-manager/infra/docker-compose.yml
    owner: preview-manager
    group: preview-manager
    mode: '0640'
  tags: [infra]

- name: Start infrastructure containers (PostgreSQL + Valkey)
  community.docker.docker_compose_v2:
    project_src: /var/www/preview-manager/infra
    state: present
  tags: [infra]

- name: Wait for PostgreSQL to be ready
  wait_for:
    host: 127.0.0.1
    port: 5432
    delay: 2
    timeout: 30
  tags: [infra]

- name: Wait for Valkey to be ready
  wait_for:
    host: 127.0.0.1
    port: 6379
    delay: 1
    timeout: 15
  tags: [infra]

# ---- Application code ----

- name: Copy preview-manager application files
  synchronize:
    src: "{{ playbook_dir }}/../../preview-manager/"
    dest: /home/preview-manager/www/previews/server/preview-manager/
    delete: no
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=.env"
      - "--exclude=venv"
      - "--exclude=.git"
  notify:
    - Restart preview-manager
    - Restart preview-worker
  tags: [code]

- name: Set proper ownership on preview-manager files
  file:
    path: /home/preview-manager/www/previews/server/preview-manager
    owner: preview-manager
    group: preview-manager
    mode: '0775'
    recurse: yes
  tags: [code]

- name: Create virtual environment
  shell: python3 -m venv venv
  args:
    chdir: /home/preview-manager/www/previews/server/preview-manager
    creates: /home/preview-manager/www/previews/server/preview-manager/venv/bin/python3
  become_user: preview-manager

- name: Upgrade pip in venv
  shell: venv/bin/python3 -m pip install --upgrade pip
  args:
    chdir: /home/preview-manager/www/previews/server/preview-manager
  become_user: preview-manager

- name: Install requirements from requirements.txt
  pip:
    requirements: /home/preview-manager/www/previews/server/preview-manager/requirements.txt
    virtualenv: /home/preview-manager/www/previews/server/preview-manager/venv
    virtualenv_command: python3 -m venv
  become_user: preview-manager

- name: Create .ssh directory for preview-manager
  file:
    path: /home/preview-manager/.ssh
    state: directory
    owner: preview-manager
    group: preview-manager
    mode: '0700'

- name: Generate SSH key pair for VM access
  community.crypto.openssh_keypair:
    path: /home/preview-manager/.ssh/preview-vm
    type: ed25519
    comment: "preview-manager VM access"
    owner: preview-manager
    group: preview-manager
    mode: '0600'

- name: Deploy preview-ssh-proxy script
  copy:
    src: "{{ playbook_dir }}/../../preview-manager/scripts/preview-ssh-proxy.sh"
    dest: /usr/local/bin/preview-ssh-proxy
    owner: root
    group: root
    mode: '0755'
  tags: [code]

- name: Build VM agent binary (local)
  delegate_to: localhost
  become: no
  shell: >
    cd {{ playbook_dir }}/../../../vm-agent &&
    GOOS=linux GOARCH=amd64 go build -o bin/vm-agent .
  changed_when: true
  tags: [code]

- name: Deploy VM agent binary
  copy:
    src: "{{ playbook_dir }}/../../../vm-agent/bin/vm-agent"
    dest: /var/www/preview-manager/cli/preview-agent
    owner: preview-manager
    group: preview-manager
    mode: '0755'
  tags: [code]

- name: Read SSH public key
  slurp:
    src: /home/preview-manager/.ssh/preview-vm.pub
  register: ssh_public_key_content
  tags: [code]

- name: Create .env file
  template:
    src: env.j2
    dest: /home/preview-manager/www/previews/server/preview-manager/.env
    owner: preview-manager
    group: preview-manager
    mode: '0640'
  tags: [code]

# ---- Systemd services ----

- name: Create preview-manager systemd service
  template:
    src: preview-manager.service.j2
    dest: /etc/systemd/system/preview-manager.service
    owner: root
    group: root
    mode: '0644'
    force: yes
  become: yes
  notify:
    - Reload systemd
    - Restart preview-manager

- name: Create preview-worker systemd service
  template:
    src: preview-worker.service.j2
    dest: /etc/systemd/system/preview-worker.service
    owner: root
    group: root
    mode: '0644'
    force: yes
  become: yes
  notify:
    - Reload systemd
    - Restart preview-worker

- name: Ensure /var/www is writable by preview-manager
  file:
    path: /var/www
    state: directory
    owner: preview-manager
    group: preview-manager
    mode: '0755'

- name: Create previews base directory
  file:
    path: /var/www
    state: directory
    owner: preview-manager
    group: preview-manager
    mode: '0755'

- name: Ensure backups directory ownership
  file:
    path: /backups
    state: directory
    owner: preview-manager
    group: preview-manager
    mode: '0775'
    recurse: yes

# CLI distribution tasks
- name: Create CLI distribution directory
  file:
    path: /var/www/preview-manager/cli
    state: directory
    owner: preview-manager
    group: preview-manager
    mode: '0775'
  tags: [cli]

- name: Copy CLI binaries
  copy:
    src: "{{ playbook_dir }}/../../../cli/dist/"
    dest: /var/www/preview-manager/cli/
    owner: preview-manager
    group: preview-manager
    mode: '0755'
  tags: [cli]

- name: Copy CLI install script
  copy:
    src: "{{ playbook_dir }}/../../../cli/install.sh"
    dest: /var/www/preview-manager/cli/install.sh
    owner: preview-manager
    group: preview-manager
    mode: '0644'
  tags: [cli]

- name: Copy CLI VERSION file
  copy:
    src: "{{ playbook_dir }}/../../../cli/VERSION"
    dest: /var/www/preview-manager/cli/VERSION
    owner: preview-manager
    group: preview-manager
    mode: '0644'
  tags: [cli]

- name: Allow preview-manager to run du with sudo (for disk usage monitoring)
  copy:
    content: "preview-manager ALL=(root) NOPASSWD: /usr/bin/du\n"
    dest: /etc/sudoers.d/preview-manager-du
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'

- name: Enable and start preview-manager service
  systemd:
    name: preview-manager
    enabled: yes
    state: started
    daemon_reload: yes

- name: Enable and start preview-worker service
  systemd:
    name: preview-worker
    enabled: yes
    state: started
    daemon_reload: yes

- name: Gracefully restart preview-worker (waits for running jobs)
  systemd:
    name: preview-worker
    state: restarted
  become: yes
  tags: [worker, never]

- name: Wait for service to be ready
  wait_for:
    port: 8000
    delay: 2
    timeout: 30
  tags: [code]

- name: Check service health
  uri:
    url: http://localhost:8000/api/health
    method: GET
    return_content: yes
  register: health_check
  failed_when: health_check.status != 200
  tags: [code]

- name: Display health check result
  debug:
    msg: "{{ health_check.json }}"
  tags: [code]
