---
# Preview Manager - Deployment Tasks

- name: Create druploy user if not exists
  user:
    name: druploy
    shell: /bin/bash
    create_home: yes
    home: /home/druploy
    groups: docker
    append: yes
    state: present

- name: Install Python dependencies
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: yes

- name: Ensure druploy-user is in druploy and docker groups
  user:
    name: druploy-user
    groups: druploy,docker
    append: yes

- name: Create druploy directory structure
  file:
    path: "{{ item }}"
    state: directory
    owner: druploy
    group: druploy
    mode: '0775'
  loop:
    - /home/druploy/www/previews/server/preview-manager
    - /var/www/druploy
    - /var/www/druploy/db-cache
    - /var/www/druploy/infra
    - /var/www/druploy/cli

# ---- Infrastructure: PostgreSQL + Valkey ----

- name: Deploy infrastructure docker-compose
  template:
    src: infra-docker-compose.yml.j2
    dest: /var/www/druploy/infra/docker-compose.yml
    owner: druploy
    group: druploy
    mode: '0640'
  tags: [infra]

- name: Start infrastructure containers (PostgreSQL + Valkey)
  community.docker.docker_compose_v2:
    project_src: /var/www/druploy/infra
    state: present
  tags: [infra]

- name: Wait for PostgreSQL to be ready
  wait_for:
    host: 127.0.0.1
    port: 5432
    delay: 2
    timeout: 30
  tags: [infra]

- name: Wait for Valkey to be ready
  wait_for:
    host: 127.0.0.1
    port: 6379
    delay: 1
    timeout: 15
  tags: [infra]

# ---- Application code ----

- name: Copy preview-manager application files
  synchronize:
    src: "{{ playbook_dir }}/../../preview-manager/"
    dest: /home/druploy/www/previews/server/preview-manager/
    delete: no
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=.env"
      - "--exclude=venv"
      - "--exclude=.git"
  notify:
    - Restart druploy
    - Restart druploy-worker
  tags: [code]

- name: Set proper ownership on preview-manager files
  file:
    path: /home/druploy/www/previews/server/preview-manager
    owner: druploy
    group: druploy
    mode: '0775'
    recurse: yes
  tags: [code]

- name: Create virtual environment
  shell: python3 -m venv venv
  args:
    chdir: /home/druploy/www/previews/server/preview-manager
    creates: /home/druploy/www/previews/server/preview-manager/venv/bin/python3
  become_user: druploy

- name: Upgrade pip in venv
  shell: venv/bin/python3 -m pip install --upgrade pip
  args:
    chdir: /home/druploy/www/previews/server/preview-manager
  become_user: druploy

- name: Install requirements from requirements.txt
  pip:
    requirements: /home/druploy/www/previews/server/preview-manager/requirements.txt
    virtualenv: /home/druploy/www/previews/server/preview-manager/venv
    virtualenv_command: python3 -m venv
  become_user: druploy

- name: Create .ssh directory for druploy
  file:
    path: /home/druploy/.ssh
    state: directory
    owner: druploy
    group: druploy
    mode: '0700'

- name: Generate SSH key pair for VM access
  community.crypto.openssh_keypair:
    path: /home/druploy/.ssh/druploy-vm
    type: ed25519
    comment: "druploy VM access"
    owner: druploy
    group: druploy
    mode: '0600'

- name: Deploy druploy-ssh-proxy script
  copy:
    src: "{{ playbook_dir }}/../../preview-manager/scripts/druploy-ssh-proxy.sh"
    dest: /usr/local/bin/druploy-ssh-proxy
    owner: root
    group: root
    mode: '0755'
  tags: [code]

- name: Build VM agent binary (local)
  delegate_to: localhost
  become: no
  shell: >
    cd {{ playbook_dir }}/../../../vm-agent &&
    VERSION=$(date +%Y%m%d)-$(git -C .. rev-parse --short HEAD) &&
    GOOS=linux GOARCH=amd64 go build -ldflags "-X main.Version=$VERSION" -o bin/vm-agent .
  changed_when: true
  tags: [code]

- name: Deploy VM agent binary
  copy:
    src: "{{ playbook_dir }}/../../../vm-agent/bin/vm-agent"
    dest: /var/www/druploy/cli/druploy-agent
    owner: druploy
    group: druploy
    mode: '0755'
  tags: [code]

- name: Read SSH public key
  slurp:
    src: /home/druploy/.ssh/druploy-vm.pub
  register: ssh_public_key_content
  tags: [code]

- name: Create .env file
  template:
    src: env.j2
    dest: /home/druploy/www/previews/server/preview-manager/.env
    owner: druploy
    group: druploy
    mode: '0640'
  tags: [code]

# ---- Systemd services ----

- name: Create druploy systemd service
  template:
    src: preview-manager.service.j2
    dest: /etc/systemd/system/druploy.service
    owner: root
    group: root
    mode: '0644'
    force: yes
  become: yes
  notify:
    - Reload systemd
    - Restart druploy

- name: Create druploy-worker systemd service
  template:
    src: preview-worker.service.j2
    dest: /etc/systemd/system/druploy-worker.service
    owner: root
    group: root
    mode: '0644'
    force: yes
  become: yes
  notify:
    - Reload systemd
    - Restart druploy-worker

- name: Ensure /var/www is writable by druploy
  file:
    path: /var/www
    state: directory
    owner: druploy
    group: druploy
    mode: '0755'

- name: Create previews base directory
  file:
    path: /var/www
    state: directory
    owner: druploy
    group: druploy
    mode: '0755'

- name: Ensure backups directory ownership
  file:
    path: /backups
    state: directory
    owner: druploy
    group: druploy
    mode: '0775'
    recurse: yes

# CLI distribution tasks
- name: Create CLI distribution directory
  file:
    path: /var/www/druploy/cli
    state: directory
    owner: druploy
    group: druploy
    mode: '0775'
  tags: [cli]

- name: Copy CLI binaries
  copy:
    src: "{{ playbook_dir }}/../../../cli/dist/"
    dest: /var/www/druploy/cli/
    owner: druploy
    group: druploy
    mode: '0755'
  tags: [cli]

- name: Copy CLI install script
  copy:
    src: "{{ playbook_dir }}/../../../cli/install.sh"
    dest: /var/www/druploy/cli/install.sh
    owner: druploy
    group: druploy
    mode: '0644'
  tags: [cli]

- name: Copy CLI VERSION file
  copy:
    src: "{{ playbook_dir }}/../../../cli/VERSION"
    dest: /var/www/druploy/cli/VERSION
    owner: druploy
    group: druploy
    mode: '0644'
  tags: [cli]

- name: Allow druploy to run du with sudo (for disk usage monitoring)
  copy:
    # !syslog stops sudo from logging every du invocation to the journal: the
    # disk-usage monitor runs it periodically and otherwise floods journald.
    content: |
      Defaults!/usr/bin/du !syslog
      druploy ALL=(root) NOPASSWD: /usr/bin/du
    dest: /etc/sudoers.d/druploy-du
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
  tags: [code]

- name: Enable and start druploy service
  systemd:
    name: druploy
    enabled: yes
    state: started
    daemon_reload: yes

- name: Enable and start druploy-worker service
  systemd:
    name: druploy-worker
    enabled: yes
    state: started
    daemon_reload: yes

- name: Gracefully restart druploy-worker (waits for running jobs)
  systemd:
    name: druploy-worker
    state: restarted
  become: yes
  tags: [worker, never]

- name: Wait for service to be ready
  wait_for:
    port: 8000
    delay: 2
    timeout: 30
  tags: [code]

- name: Check service health
  uri:
    url: http://localhost:8000/api/health
    method: GET
    return_content: yes
  register: health_check
  failed_when: health_check.status != 200
  tags: [code]

- name: Display health check result
  debug:
    msg: "{{ health_check.json }}"
  tags: [code]
