---
# Preview UI - Server setup for GitHub Actions deployment
# The actual deploy happens via GitHub Actions (.github/workflows/deploy.yml)
# This role only sets up the infrastructure needed for that workflow.

- name: Install Node.js 22 LTS (NodeSource)
  block:
    - name: Check if Node.js 22 is installed
      command: node --version
      register: node_version
      changed_when: false
      failed_when: false

    - name: Add NodeSource GPG key
      shell: curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
      args:
        creates: /usr/share/keyrings/nodesource.gpg
      when: node_version.rc != 0 or 'v22' not in node_version.stdout

    - name: Add NodeSource repository
      copy:
        content: "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main"
        dest: /etc/apt/sources.list.d/nodesource.list
      when: node_version.rc != 0 or 'v22' not in node_version.stdout

    - name: Install Node.js
      apt:
        name: nodejs
        state: present
        update_cache: yes
      when: node_version.rc != 0 or 'v22' not in node_version.stdout

- name: Add GitHub Actions deploy key to authorized_keys
  authorized_key:
    user: root
    key: "{{ vault_github_actions_ssh_public_key }}"
    comment: "github-actions-preview-ui"
    state: present

- name: Create preview-ui directory
  file:
    path: /home/preview-manager/www/previews/preview-ui
    state: directory
    owner: preview-manager
    group: preview-manager
    mode: '0775'

- name: Create systemd service file
  template:
    src: preview-ui.service.j2
    dest: /etc/systemd/system/preview-ui.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart preview-ui

- name: Enable preview-ui service
  systemd:
    name: preview-ui
    enabled: yes
    daemon_reload: yes
