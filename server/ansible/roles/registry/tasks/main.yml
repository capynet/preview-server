---
# Docker Registry - Private registry for preview images

- name: Create registry data directory
  file:
    path: /var/lib/registry
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Start Docker registry container
  community.docker.docker_container:
    name: preview-registry
    image: registry:2
    state: started
    restart_policy: always
    ports:
      - "5000:5000"
    volumes:
      - /var/lib/registry:/var/lib/registry
    networks:
      - name: preview-network
    env:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"

- name: Wait for registry to be ready
  uri:
    url: http://localhost:5000/v2/
    method: GET
    status_code: 200
  retries: 10
  delay: 2

# Build and push preview-drupal images for each PHP version
- name: Create temporary build directory
  file:
    path: /tmp/preview-drupal-build
    state: directory
    mode: '0755'

- name: Copy Dockerfile.drupal to build directory
  copy:
    src: "{{ playbook_dir }}/../../preview-manager/docker/Dockerfile.drupal"
    dest: /tmp/preview-drupal-build/Dockerfile
    mode: '0644'

- name: Build and push preview-drupal images
  shell: |
    docker build --build-arg PHP_VERSION={{ item }} -t localhost:5000/preview-drupal:php{{ item }} /tmp/preview-drupal-build
    docker push localhost:5000/preview-drupal:php{{ item }}
  loop:
    - "8.1"
    - "8.2"
    - "8.3"
  register: build_result
  changed_when: true

- name: Clean up build directory
  file:
    path: /tmp/preview-drupal-build
    state: absent

# Pull, tag and push standard images from Docker Hub
- name: Pull and push database images
  shell: |
    docker pull {{ item }}
    docker tag {{ item }} localhost:5000/{{ item }}
    docker push localhost:5000/{{ item }}
  loop:
    - "mysql:8.0"
    - "mysql:5.7"
    - "mariadb:10.6"
    - "mariadb:11.4"
  register: db_pull_result
  changed_when: true

- name: Pull and push Redis/Valkey images
  shell: |
    docker pull {{ item }}
    docker tag {{ item }} localhost:5000/{{ item }}
    docker push localhost:5000/{{ item }}
  loop:
    - "redis:7-alpine"
    - "valkey/valkey:8-alpine"
  register: redis_pull_result
  changed_when: true

- name: Pull and push Solr images
  shell: |
    docker pull {{ item }}
    docker tag {{ item }} localhost:5000/{{ item }}
    docker push localhost:5000/{{ item }}
  loop:
    - "solr:8"
    - "solr:9"
  register: solr_pull_result
  changed_when: true

- name: List registry contents
  uri:
    url: http://localhost:5000/v2/_catalog
    method: GET
    return_content: yes
  register: registry_catalog

- name: Display registry contents
  debug:
    msg: "Registry images: {{ registry_catalog.json }}"
