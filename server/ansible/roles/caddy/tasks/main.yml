---
# Caddy as Docker container with cloudflare DNS + Admin API

- name: Create caddy docker directory
  file:
    path: /opt/druploy-caddy
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create landing page directory
  file:
    path: /opt/preview-landing
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy landing page files
  copy:
    src: "{{ playbook_dir }}/../../preview-manager/landing/"
    dest: /opt/preview-landing/
    owner: root
    group: root
    mode: '0644'
  register: landing_files

- name: Copy Caddy Dockerfile
  copy:
    src: "{{ playbook_dir }}/../../preview-manager/docker/Dockerfile.caddy"
    dest: /opt/druploy-caddy/Dockerfile.caddy
    owner: root
    group: root
    mode: '0644'
  register: caddy_dockerfile

- name: Generate Caddyfile
  template:
    src: Caddyfile.j2
    dest: /opt/druploy-caddy/Caddyfile
    owner: root
    group: root
    mode: '0644'
  register: caddy_caddyfile

- name: Copy Caddy docker-compose
  template:
    src: docker-compose.caddy.yml.j2
    dest: /opt/druploy-caddy/docker-compose.yml
    owner: root
    group: root
    mode: '0640'
  register: caddy_compose

- name: Build Caddy image
  command: docker compose build --no-cache
  args:
    chdir: /opt/druploy-caddy
  when: caddy_dockerfile.changed or caddy_caddyfile.changed

- name: Remove stale Caddy container (if exists outside compose)
  command: docker rm -f druploy-caddy
  register: caddy_rm
  changed_when: caddy_rm.rc == 0
  failed_when: false

- name: Start Caddy container
  command: docker compose up -d --force-recreate
  args:
    chdir: /opt/druploy-caddy

- name: Wait for Caddy to be healthy
  wait_for:
    port: 443
    delay: 3
    timeout: 30
