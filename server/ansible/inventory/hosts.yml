all:
  hosts:
    preview-server:
      ansible_host: 91.99.157.66
      ansible_user: root
  vars:
    domain: preview-mr.com
    letsencrypt_email: capy.net@gmail.com
    drupal_version: 10
    gitlab_url: https://gitlab.com
    gitlab_api_token: "{{ vault_gitlab_api_token | default('') }}"
    gitlab_group_name: "preview-tests"
    pipeline_check_interval_seconds: 5  # Check for active pipelines every 5 seconds
    gitlab_webhook_secret: "{{ vault_gitlab_webhook_secret }}"

    # Auth
    secret_key: "{{ vault_secret_key | default('change-me-in-production') }}"
    gitlab_oauth_client_id: "{{ vault_gitlab_oauth_client_id }}"
    gitlab_oauth_client_secret: "{{ vault_gitlab_oauth_client_secret }}"
    google_oauth_client_id: "{{ vault_google_oauth_client_id }}"
    google_oauth_client_secret: "{{ vault_google_oauth_client_secret }}"
    gitlab_connect_client_id: "{{ vault_gitlab_connect_client_id }}"
    gitlab_connect_client_secret: "{{ vault_gitlab_connect_client_secret }}"
    postgres_password: "{{ vault_postgres_password | default('preview_manager') }}"
    frontend_url: "https://app.preview-mr.com"

    # Resend (email invitations)
    resend_api_key: "{{ vault_resend_api_key }}"

    # Cloudflare
    cloudflare_api_token: "{{ vault_cloudflare_api_token }}"
    cloudflare_r2_api_token: "{{ vault_cloudflare_r2_api_token }}"

    # Hetzner Cloud
    hetzner_api_token: "{{ vault_hetzner_api_token }}"
    hetzner_location: fsn1
    hetzner_snapshot_id: "{{ vault_hetzner_snapshot_id | default(0) }}"

    # Storage backend: "s3" or "storagebox"
    storage_backend: s3

    # Hetzner Object Storage (S3) — kept for fallback
    hetzner_s3_endpoint: "{{ vault_hetzner_s3_endpoint }}"
    hetzner_s3_access_key: "{{ vault_hetzner_s3_access_key }}"
    hetzner_s3_secret_key: "{{ vault_hetzner_s3_secret_key }}"
    hetzner_s3_bucket: preview-manager

    # Hetzner Storage Box (SFTP)
    storagebox_host: "{{ vault_storagebox_host }}"
    storagebox_port: 23
    storagebox_user: "{{ vault_storagebox_user }}"

    # Private Docker Registry
    docker_registry: "91.99.157.66:5000"

    # Tinyproxy (composer forward proxy)
    tinyproxy_user: proxy
    tinyproxy_password: "{{ vault_tinyproxy_password }}"

    # Seed data
    seed_admin_email: "{{ vault_seed_admin_email }}"
    seed_admin_name: "{{ vault_seed_admin_name }}"
    seed_admin_password_hash: "{{ vault_seed_admin_password_hash }}"
    seed_test_email: "{{ vault_seed_test_email }}"
    seed_test_name: "{{ vault_seed_test_name }}"
    seed_test_google_id: "{{ vault_seed_test_google_id }}"
    seed_org_slug: "{{ vault_seed_org_slug }}"
    seed_org_name: "{{ vault_seed_org_name }}"
    seed_org_color: "{{ vault_seed_org_color }}"
    seed_org_gitlab_url: "{{ vault_seed_org_gitlab_url }}"
    seed_org_gitlab_token: "{{ vault_seed_org_gitlab_token }}"
    seed_project_slug: "{{ vault_seed_project_slug }}"
    seed_project_name: "{{ vault_seed_project_name }}"
    seed_project_gitlab_id: "{{ vault_seed_project_gitlab_id }}"
    seed_project_gitlab_path: "{{ vault_seed_project_gitlab_path }}"
    seed_project_gitlab_url: "{{ vault_seed_project_gitlab_url }}"
    seed_project_gitlab_branch: "{{ vault_seed_project_gitlab_branch }}"
    seed_project_env_vars: "{{ vault_seed_project_env_vars }}"
    seed_email_domain: "{{ vault_seed_email_domain }}"
    seed_email_domain_role: "{{ vault_seed_email_domain_role }}"
