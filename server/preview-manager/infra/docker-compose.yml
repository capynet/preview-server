services:
  postgres:
    image: postgres:17-alpine
    container_name: preview-postgres
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: preview_manager
      POSTGRES_USER: preview_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-preview_manager}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preview_manager"]
      interval: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: preview-valkey
    restart: unless-stopped
    volumes:
      - valkeydata:/data
    ports:
      - "127.0.0.1:6379:6379"
    command: valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  pgdata:
  valkeydata:
