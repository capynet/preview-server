---
- name: Setup Runner Server
  hosts: runner-server
  become: yes

  roles:
    - docker
    - gitlab-runner

  post_tasks:
    - name: Installation summary
      debug:
        msg: |
          ==========================================
          RUNNER SERVER CONFIGURED
          ==========================================

          Components installed:
            ✓ Docker
            ✓ GitLab Runner (executor: docker)

          The runner executes jobs in Docker containers
          and deploys previews to the druploy-server via SSH.

          ==========================================
