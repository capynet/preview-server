---
- name: Verify if GitLab Runner repository exists
  stat:
    path: /etc/apt/sources.list.d/runner_gitlab-runner.list
  register: gitlab_repo

- name: Add GitLab Runner repository
  shell: |
    curl -L https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh | bash
  when: not gitlab_repo.stat.exists

- name: Install GitLab Runner
  apt:
    name: gitlab-runner
    state: present
    update_cache: yes

- name: Add gitlab-runner to docker group
  user:
    name: gitlab-runner
    groups: docker
    append: yes

- name: Restart GitLab Runner to apply docker group
  systemd:
    name: gitlab-runner
    state: restarted
    enabled: yes

- name: Verify if runner is already registered
  shell: gitlab-runner list 2>&1 | grep -q "{{ gitlab_runner_name }}"
  register: runner_registered
  failed_when: false
  changed_when: false

- name: Unregister existing runner (to re-register with tags)
  shell: gitlab-runner unregister --all-runners
  when:
    - runner_registered.rc == 0
    - gitlab_runner_force_reregister | default(false)

- name: Register GitLab Runner
  shell: |
    gitlab-runner register \
      --non-interactive \
      --url "{{ gitlab_url }}" \
      --token "{{ gitlab_runner_token }}" \
      --executor "{{ gitlab_runner_executor }}" \
      --name "{{ gitlab_runner_name }}" \
      {% if gitlab_runner_executor == 'docker' %}
      --docker-image "{{ gitlab_runner_docker_image }}" \
      --docker-privileged \
      {% endif %}

  when:
    - (runner_registered.rc != 0) or (gitlab_runner_force_reregister | default(false))
    - gitlab_runner_token is defined
    - gitlab_runner_token | length > 0

- name: Verify runner status
  shell: gitlab-runner list
  register: runner_status
  changed_when: false

- name: Show registered runners
  debug:
    msg: "{{ runner_status.stdout_lines }}"

- name: Create local cache directory
  file:
    path: "{{ gitlab_runner_cache_path | default('/var/cache/gitlab-runner') }}"
    state: directory
    owner: gitlab-runner
    group: gitlab-runner
    mode: '0755'

- name: Create .ssh directory for Docker jobs
  file:
    path: /etc/gitlab-runner/.ssh
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Generate SSH keypair to connect to druploy-server
  openssh_keypair:
    path: /etc/gitlab-runner/.ssh/id_ed25519
    type: ed25519
    comment: "gitlab-runner@runner-server"
  register: ssh_keypair

- name: Get host key of druploy-server
  shell: ssh-keyscan -H {{ preview_server_host }} 2>/dev/null
  register: preview_server_hostkey
  changed_when: false

- name: Create known_hosts with druploy-server host key
  copy:
    content: "{{ preview_server_hostkey.stdout }}\n"
    dest: /etc/gitlab-runner/.ssh/known_hosts
    mode: '0644'

- name: Show SSH public key (copy to druploy-server)
  debug:
    msg: "{{ ssh_keypair.public_key }}"

- name: Copy public key to druploy-server
  authorized_key:
    user: "{{ preview_server_user }}"
    key: "{{ ssh_keypair.public_key }}"
    state: present
  delegate_to: "{{ preview_server_host }}"
  vars:
    ansible_user: root

- name: Configure local cache in config.toml
  template:
    src: config.toml.j2
    dest: /etc/gitlab-runner/config.toml
    owner: root
    group: root
    mode: '0600'
  notify: restart gitlab-runner
